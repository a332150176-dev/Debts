name: Build Pinkas Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pinkas-android-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build offline web app
        run: npm run build
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile
          html = pathlib.Path("web/index.html").read_text(encoding="utf-8")
          scripts = list(re.finditer(r"<script([^>]*)>(.*?)</script>", html, re.S))
          with tempfile.TemporaryDirectory() as folder:
              checked = 0
              for index, match in enumerate(scripts):
                  attrs, source = match.group(1), match.group(2)
                  if "src=" in attrs or not source.strip():
                      continue
                  suffix = ".mjs" if 'type="module"' in attrs or "type='module'" in attrs else ".js"
                  path = pathlib.Path(folder) / f"inline-{index}{suffix}"
                  path.write_text(source, encoding="utf-8")
                  subprocess.run(["node", "--check", str(path)], check=True)
                  checked += 1
              print(f"Validated {checked} inline JavaScript blocks.")
          PY
      - name: Generate Android project
        run: npx cap add android
      - name: Sync app with Android
        run: npx cap sync android
      - name: Enable exact Android reminders
        run: python3 scripts/patch_android_manifest.py
      - name: Generate custom launcher icon
        run: python3 scripts/generate_android_icons.py android/app/src/main/res
      - name: Configure persistent APK signing
        env:
          PINKAS_KEYSTORE_BASE64: ${{ secrets.PINKAS_KEYSTORE_BASE64 }}
          PINKAS_KEYSTORE_PASSWORD: ${{ secrets.PINKAS_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${PINKAS_KEYSTORE_BASE64:?Missing PINKAS_KEYSTORE_BASE64 repository secret}"
          : "${PINKAS_KEYSTORE_PASSWORD:?Missing PINKAS_KEYSTORE_PASSWORD repository secret}"
          printf '%s' "$PINKAS_KEYSTORE_BASE64" | base64 --decode > android/app/pinkas-release-key.p12
          chmod 600 android/app/pinkas-release-key.p12
          openssl pkcs12 -in android/app/pinkas-release-key.p12 -passin env:PINKAS_KEYSTORE_PASSWORD -noout >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/build.gradle")
          source = path.read_text(encoding="utf-8")
          if "pinkas-release-key.p12" in source or "signingConfigs.pinkas" in source:
              raise SystemExit("Persistent signing configuration already exists; refusing to patch twice.")
          android = re.search(r"\\bandroid\\s*\\{", source)
          if not android:
              raise SystemExit("Could not find the Android Gradle configuration block.")
          source = source[:android.end()] + """
              signingConfigs {
                  pinkas {
                      storeFile file("pinkas-release-key.p12")
                      storeType "PKCS12"
                      storePassword System.getenv("PINKAS_KEYSTORE_PASSWORD")
                      keyAlias "pinkas-release"
                      keyPassword System.getenv("PINKAS_KEYSTORE_PASSWORD")
                  }
              }
          """ + source[android.end():]
          build_types = re.search(r"\\bbuildTypes\\s*\\{", source)
          if not build_types:
              raise SystemExit("Could not find the Android buildTypes block.")
          source = source[:build_types.end()] + """
                  debug {
                      signingConfig signingConfigs.pinkas
                  }
          """ + source[build_types.end():]
          path.write_text(source, encoding="utf-8")
          print("Configured debug APK signing with the persistent Pinkas key.")
          PY
      - name: Compile debug APK
        env:
          PINKAS_KEYSTORE_PASSWORD: ${{ secrets.PINKAS_KEYSTORE_PASSWORD }}
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          python3 - <<'PY'
          import subprocess
          apk = "android/app/build/outputs/apk/debug/app-debug.apk"
          output = subprocess.check_output([
              "$ANDROID_HOME/build-tools/36.0.0/apksigner", "verify", "--print-certs", apk
          ], text=True)
          expected = "efec6e21c2bbb351553e9e0eebbd1f29e1e1cd499a0ff5e98219a03e12a6e443"
          actual = output.lower().replace(":", "").replace(" ", "")
          if expected not in actual:
              raise SystemExit("APK certificate does not match the fixed Pinkas signing certificate.")
          print("APK certificate fingerprint matches the persistent Pinkas key.")
          PY
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinkas-debts-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-apk
          target_commitish: main
          name: פנקס — APK להורדה
          body: |
            הגרסה העדכנית של פנקס — ניהול חובות והחזרים.
            הנתונים נשמרים מקומית במכשיר; אין צורך בחיבור לאינטרנט.
            זוהי גרסת Debug להתקנה ידנית, לא גרסת חנות חתומה.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
