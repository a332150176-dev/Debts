name: Build Pinkas Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pinkas-android-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build offline web app
        run: npm run build
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile
          html = pathlib.Path("web/index.html").read_text(encoding="utf-8")
          scripts = list(re.finditer(r"<script([^>]*)>(.*?)</script>", html, re.S))
          with tempfile.TemporaryDirectory() as folder:
              checked = 0
              for index, match in enumerate(scripts):
                  attrs, source = match.group(1), match.group(2)
                  if re.search(r"\\bsrc\\s*=", attrs) or not source.strip():
                      continue
                  suffix = ".mjs" if re.search(r"type=[\\"']module[\\"']", attrs) else ".js"
                  path = pathlib.Path(folder) / f"inline-{index}{suffix}"
                  path.write_text(source, encoding="utf-8")
                  subprocess.run(["node", "--check", str(path)], check=True)
                  checked += 1
              print(f"Validated {checked} inline JavaScript blocks.")
          PY
      - name: Generate Android project
        run: npx cap add android
      - name: Sync app with Android
        run: npx cap sync android
      - name: Enable exact Android reminders
        run: python3 scripts/patch_android_manifest.py
      - name: Generate custom launcher icon
        run: python3 scripts/generate_android_icons.py android/app/src/main/res
      - name: Compile debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinkas-debts-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-apk
          target_commitish: main
          name: פנקס — APK להורדה
          body: |
            הגרסה העדכנית של פנקס — ניהול חובות והחזרים.
            הנתונים נשמרים מקומית במכשיר; אין צורך בחיבור לאינטרנט.
            זוהי גרסת Debug להתקנה ידנית, לא גרסת חנות חתומה.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
